[package]
name = "stealth"
version = "0.1.0"
authors = ["strbrgr <jocsti@web.de>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "stealth"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
# The live camera and inference paths are throughput-bound, not flash-bound.
opt-level = 2

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = 2
[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc.git" }

[dependencies]
anyhow = "1"
log = "0.4"
esp-idf-hal = "0.46.1"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
embedded-graphics = "0.8"
mipidsi = "0.9"
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"] }

[build-dependencies]
embuild = "0.33"

# ESP-Video provides the P4 MIPI-CSI/OV2710 driver used by `camera_bridge`.
# The 0.9 series is the version used by Espressif's P4X-EYE ESP-IDF 5.5 demo.
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components"]
bindings_header = "components/camera_bridge/include/camera_bridge.h"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "esp_video", version = "0.9.*" }

# ESP-DL's COCO wrapper supplies a quantized 320×320 YOLO11n detector. The firmware loads the
# selected `.espdl` file from the MicroSD card, rather than embedding model weights in flash.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "coco_detect", version = "0.4.0" }
